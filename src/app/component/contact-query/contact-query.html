<div class="contact-form-container">
  <h2>Submit your query</h2>

  <form (ngSubmit)="sendQuery()">
    <div class="form-group">
      <label>Name</label>
      <input type="text" [(ngModel)]="formData.name" name="name" required />
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" [(ngModel)]="formData.toEmail" name="toEmail" required />
    </div>

    <div class="form-group">
      <label>Mobile</label>
      <input type="text" [(ngModel)]="formData.mobile" name="mobile" required />
    </div>

    <div class="form-group">
      <label>Message</label>
      <textarea [(ngModel)]="formData.body" name="body" rows="4" required></textarea>
    </div>

    <button type="submit" [disabled]="isLoading">
      {{ isLoading ? 'Sending...' : 'Send Message' }}
    </button>
  </form>

  <p class="success" *ngIf="response">Query submitted successfully!</p>
  <p class="error" *ngIf="error">{{ error }}</p>
</div>
