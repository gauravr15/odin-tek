<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OdinTek</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <style>
    /* Splash screen style */
    #app-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #0d1117; /* dark background (GitHub style) */
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      color: #fff;
      font-family: sans-serif;
      font-size: 1.2rem;
      letter-spacing: 2px;
      flex-direction: column;
    }

    #app-loader .spinner {
      margin-top: 15px;
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top: 4px solid #fff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Loader visible before Angular bootstraps -->
  <div id="app-loader">
    Loading OdinTek...
    <div class="spinner"></div>
  </div>

  <!-- Angular app root -->
  <app-root></app-root>
</body>
</html>
